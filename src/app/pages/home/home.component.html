<div class="container py-5">
  <div class="text-center">
    <h1 class="text-primary">Bem-vindo à Home!</h1>
    <p class="lead">Este projeto está usando Angular 18.2.19 com Bootstrap 5.</p>
  </div>
</div>

<div class="container mt-4">
  <p>Importar arquivo de movimentações da B3</p>
  <input type="file" (change)="onFileChange($event)" accept=".xlsx, .xls" class="form-control mt-3" />

  <div style="margin-top:10px;">
    <p *ngIf="importando">Carregando...</p>
  </div>

  <div style="margin-top:10px;">
    <p *ngIf="concluido">Conluído !</p>
  </div>

</div>
